services:
  app:
    build: .
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      IRISHCLINICALRAG_LOG_LEVEL: info
      IRISHCLINICALRAG_DATA_DIR: /app/data
      IRISHCLINICALRAG_CONFIG_PATH: /app/configs/default.json
      IRISHCLINICALRAG_FRONTEND_DIR: /app/frontend
      IRISHCLINICALRAG_WARM_MODELS: "1"
      HF_HOME: /app/data/models/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    stop_grace_period: 35s
    restart: unless-stopped
