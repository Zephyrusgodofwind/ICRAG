[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "irishclinicalrag"
version = "0.1.0"
description = "Evidence-grounded retrieval for authoritative Irish clinical guidance"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "IrishClinicalRAG contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5.1,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ml = [
  "numpy>=2.1,<3",
  "sentence-transformers>=3.3,<4",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
irishclinicalrag = "irishclinicalrag.cli:main"
irishclinicalrag-api = "irishclinicalrag.api.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/irishclinicalrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
